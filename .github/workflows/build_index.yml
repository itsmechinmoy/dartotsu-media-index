name: Build Full Media Index

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ANIME (non-adult + adult)
        run: python scripts/fetch_anilist.py ANIME --out tmp
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}

      - name: Fetch MANGA (non-adult + adult)
        run: python scripts/fetch_anilist.py MANGA --out tmp
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}

      - name: Build shards and search index
        run: python scripts/build_index.py --tmp tmp --out .

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ search/
          git diff --staged --quiet || git commit -m "chore: rebuild media index $(date -u +'%Y-%m-%d')"
          git push
