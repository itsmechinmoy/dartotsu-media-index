name: Incremental Media Index Update

on:
  schedule:
    - cron: '0 4 * * 1-6'   # Mon–Sat at 04:00 UTC (skips Sunday = full rebuild day)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run incremental update (last 48 h)
        run: python scripts/merge_incremental.py
        env:
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ search/
          git diff --staged --quiet || git commit -m "chore: incremental update $(date -u +'%Y-%m-%d')"
          git push
